name: Docker image
# Builds ghcr.io/janzeerorg/janzeer-node from the SIGNED release bundle (x86-64 + arm64) and pushes it.
# Runs when a release is published, or by hand for a given version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package (e.g. 0.1.7)"
        required: true
      latest:
        description: "Also tag :latest"
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/janzeerorg/janzeer-node
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then V="${{ github.event.release.tag_name }}"; else V="${{ inputs.version }}"; fi
          V="${V#v}"; echo "version=$V" >> "$GITHUB_OUTPUT"
          L="${{ inputs.latest }}"; [ "${{ github.event_name }}" = "release" ] && L=true
          TAGS="$IMAGE:$V"; [ "$L" = "true" ] && TAGS="$TAGS,$IMAGE:latest"; echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build x86-64 and smoke-test it (boots the node, reads /api/v1/info/version)
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: ${{ env.IMAGE }}:smoke
      - name: Smoke test
        run: |
          docker run -d --name smoke -e JANZEER_ROOT_NODES=127.0.0.1:1 -p 7019:7019 ${IMAGE}:smoke
          for i in $(seq 1 60); do curl -fsS http://localhost:7019/api/v1/info/version && break; sleep 2; done
          curl -fsS http://localhost:7019/api/v1/info/version | grep -q '"${{ steps.v.outputs.version }}"'
          docker stop -t 30 smoke
      - name: Build and push x86-64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
